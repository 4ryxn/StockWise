[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stockwise"
version = "0.1.0"
description = "Retail demand forecasting and inventory optimization platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<7",
  "ruff>=0.8,<1",
]
data = [
  "pyarrow>=18,<24",
]
modeling = [
  "lightgbm>=4.5,<5",
  "mlflow>=2.18,<4",
  "scikit-learn>=1.5,<2",
]
app = [
  "fastapi>=0.115,<1",
  "plotly>=5.24,<7",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.40,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
stockwise = "stockwise.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stockwise"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
